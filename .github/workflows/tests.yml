name: LeakCheck CI & Registry Verification

on:
  push:
    branches: [main, master, "v2-dev", "fix/*", "feat/*", "release/*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run test suite with pytest
        run: |
          pytest -v --durations=10 tests/

      - name: Validate registry schemas and records
        run: |
          python -c "
          import json
          from pathlib import Path
          reg = Path('registry/datasets.json')
          assert reg.is_file(), 'registry/datasets.json missing'
          data = json.load(open(reg, encoding='utf-8'))
          assert data['version'] == '2.0.0'
          assert len(data['datasets']) >= 4
          print(f'Registry verified: {len(data[\"datasets\"])} datasets valid.')
          "
