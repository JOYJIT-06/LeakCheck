[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emi"
version = "2.0.0.dev0"
description = "LeakCheck V2: Multi-dataset EEG validation and data leakage benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Joyjit Das", email = "dasjoyjit84@gmail.com"}
]
keywords = [
    "electroencephalography",
    "brain-computer-interface",
    "data-leakage",
    "machine-learning",
    "reproducibility",
    "cross-validation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "mne>=1.7,<1.14",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "joblib"
]

[project.urls]
Homepage = "https://github.com/JOYJIT-06/LeakCheck"
Repository = "https://github.com/JOYJIT-06/LeakCheck.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "v2: marks tests as part of the expanded V2 development framework (deselect with '-m \"not v2\"')"
]
